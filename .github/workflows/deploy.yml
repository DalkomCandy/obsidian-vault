name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/travel-planning-location-app-noq5eg]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes one already queued.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project site lives under /<repo>/, so the bundle and the PWA
          # manifest have to be built for that path.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Vite inlines these at build time, so they must be present here
          # rather than supplied at runtime.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::VITE_GOOGLE_MAPS_API_KEY secret is not set. Without it Vite strips the whole app out of the bundle and the deployed page only shows the setup notice."
            exit 1
          fi
          npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
